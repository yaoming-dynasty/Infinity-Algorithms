
name: Autonomous Mathematical Research Bot

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      research_topic:
        description: "Mathematical research topic"
        required: false
        default: "reasoning engine invariants"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mathematical-research-bot
  cancel-in-progress: false

jobs:
  mathematical-research:
    name: Research, Verify, and Propose Improvements
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install sympy pytest

      - name: Determine research topic
        id: topic
        env:
          INPUT_TOPIC: ${{ github.event.inputs.research_topic }}
        run: |
          TOPIC="${INPUT_TOPIC:-reasoning engine invariants}"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"

      - name: Run mathematical research
        env:
          RESEARCH_TOPIC: ${{ steps.topic.outputs.topic }}
        run: |
          python scripts/math_research_bot.py \
            --topic "$RESEARCH_TOPIC" \
            --output research/proposals/

      - name: Verify mathematical proposals
        run: |
          python scripts/verify_research.py research/proposals/

      - name: Test reasoning engine
        run: |
          pytest -q

      - name: Check proposed changes
        run: |
          git diff --check

      - name: Create research pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/mathematical-research
          delete-branch: true
          title: "Automated mathematical research: proposed improvements"
          commit-message: "research: propose verified mathematical improvements"
          body: |
            ## Autonomous Mathematical Research

            This pull request was generated by the research workflow.

            It may contain:
            - New mathematical conjectures
            - Proof attempts and counterexamples
            - Invariant improvements
            - Reasoning Engine refinements
            - New verification tests

            All proposed changes require human review.
            Passing tests do not establish mathematical correctness.
          add-paths: |
            research/proposals/
            reasoning_engine.py
            tests/
