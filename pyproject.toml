[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-algorithms"
version = "0.1.0"
description = "DNA-like reasoning and boundary framework experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["dna_bridge", "reasoning_engine", "reasoning_engine_demo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
